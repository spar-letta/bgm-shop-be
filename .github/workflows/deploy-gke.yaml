name: Build and deploy BE to GKE

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: bgm-shop
  REGION: europe-west1
  AR_REPO: bgm-shop
  CLUSTER: bgm-shop
  NAMESPACE: bgm-shop
  IMAGE: europe-west1-docker.pkg.dev/bgm-shop/bgm-shop/be

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build jar
        run: mvn -B -DskipTests package

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          SHA="${GITHUB_SHA::12}"
          docker build -t "${IMAGE}:${SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy
        run: |
          # Push :latest for Argo/GitOps manifests; also pin SHA for traceability.
          kubectl -n "${NAMESPACE}" set image deploy/bgm-shop-be \
            "be=${IMAGE}:${SHA}"
          kubectl -n "${NAMESPACE}" annotate deploy/bgm-shop-be \
            "deployment.kubernetes.io/revision-history-note=github.com/${{ github.repository }}@${SHA}" \
            --overwrite || true
          kubectl -n "${NAMESPACE}" rollout status deploy/bgm-shop-be --timeout=600s
