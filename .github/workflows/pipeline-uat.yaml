name: Build and Push Docker Image to GCP

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK for Maven (Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # Cache Maven dependencies for faster builds
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Remove any empty or corrupt JAR files from the Maven cache
      - name: Purge corrupt Maven cache entries
        run: |
          if [ -d "$HOME/.m2/repository" ]; then
            find "$HOME/.m2/repository" -name "*.jar" -empty -delete
          else
            echo "Maven cache directory not found; skipping purge."
          fi

      # Build the Spring Boot app using Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Verify packaged SnakeYAML dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path("target").glob("*.jar"))
          if len(jars) != 1:
              raise SystemExit(f"Expected one application JAR, found {len(jars)}")
          with ZipFile(jars[0]) as archive:
              yaml_jars = [name for name in archive.namelist()
                           if name.startswith("BOOT-INF/lib/snakeyaml-") and name.endswith(".jar")]
          if len(yaml_jars) != 1 or "android" in yaml_jars[0]:
              raise SystemExit(f"Unexpected packaged SnakeYAML dependencies: {yaml_jars}")
          print(f"Verified {yaml_jars[0]}")
          PY

      # Generate dynamic Docker tag using current date and a counter
      - name: Generate Docker tag
        id: tag
        run: |
          IMAGE_TAG="uat"  # Set the tag name to 'uat'
          echo "tag=${IMAGE_TAG}" >> $GITHUB_ENV

      # Authenticate with Google Cloud
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_UAT }}  # Ensure your service account key is stored securely in GitHub Secrets

      # Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Configure Docker to use gcloud as a credential helper for Artifact Registry
      - name: Configure Docker with gcloud credentials
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      # Build the Docker image and tag it
      - name: Build Docker Image
        run: |
          docker build -t europe-west1-docker.pkg.dev/itibari-uat-454120/itibariapp/itibari:${{ env.tag }} .

      # Push the Docker image to Google Artifact Registry
      - name: Push Docker Image to Artifact Registry
        run: |
          docker push europe-west1-docker.pkg.dev/itibari-uat-454120/itibariapp/itibari:${{ env.tag }}
