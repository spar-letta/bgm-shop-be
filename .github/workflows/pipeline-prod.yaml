name: Build and Push Docker Image to GCP

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # === AGGRESSIVE CLEANUP - BEFORE ANY CACHE ===
      - name: Aggressive Maven Cache Cleanup
        run: |
          echo "🧹 Starting aggressive Maven cache cleanup..."

          # Target the exact corrupted file
          rm -rf "$HOME/.m2/repository/xml-apis/xml-apis-ext/1.3.04" || true
          
          # Clean related compiler cache
          rm -rf "$HOME/.m2/repository/org/codehaus/plexus/plexus-compiler-javac/2.15.0" || true
          
          # Clean entire xml-apis group (safe and small)
          rm -rf "$HOME/.m2/repository/xml-apis" || true

          # Remove any empty or tiny JARs
          find "$HOME/.m2/repository" -name "*.jar" -size -100k -delete || true

          echo "✅ Aggressive cleanup completed."

      # Set up Java + Maven cache (after cleanup)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # Build
      - name: Build with Maven
        run: mvn clean package -DskipTests -U --batch-mode --no-transfer-progress -e

      - name: Verify packaged SnakeYAML dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path("target").glob("*.jar"))
          if len(jars) != 1:
              raise SystemExit(f"Expected one application JAR, found {len(jars)}")
          with ZipFile(jars[0]) as archive:
              yaml_jars = [name for name in archive.namelist()
                           if name.startswith("BOOT-INF/lib/snakeyaml-") and name.endswith(".jar")]
          if len(yaml_jars) != 1 or "android" in yaml_jars[0]:
              raise SystemExit(f"Unexpected packaged SnakeYAML dependencies: {yaml_jars}")
          print(f"Verified {yaml_jars[0]}")
          PY

      - name: Generate Docker tag
        id: tag
        run: |
          IMAGE_TAG="prod"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_PROD }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Build & Push Docker Image
        run: |
          docker build -t europe-west1-docker.pkg.dev/itibari-prod-461921/itibariprod/itibari:${{ env.tag }} .
          docker push europe-west1-docker.pkg.dev/itibari-prod-461921/itibariprod/itibari:${{ env.tag }}