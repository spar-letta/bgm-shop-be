# instructions for tra integration test, these values will be used in the test and should be set in the environment variables before running the tests
# 1. create a application-local.yaml file in the src/test/resources directory with the following content:
# 2. set the environment variables for the tra integration test, these values will be used in the test and should be set in the environment variables before running the tests
#    - TRA_BASE_URL: the base url of the tra integration, e.g. https://api.tra.com/v1 etc
# 3. add it to .gitignore file to avoid committing it to the repository
# 4. run the tests, the tra integration test will use the values from the application-local.yaml file and the environment variables to perform the integration test with the tra system

tra:
  integration:
    base-url: ${TRA_BASE_URL}
    receipt-endpoint: ${TRA_RECEIPT_ENDPOINT}
  branch: ${TRA_BRANCH}
  department: ${TRA_DEPARTMENT}
  device-number: ${TRA_DEVICE_NUMBER}
  customer-id-type: ${TRA_CUSTOMER_ID_TYPE}
  pay-type: ${TRA_PAY_TYPE}
  fcode: ${TRA_FCODE}
  fcode-token: ${TRA_FCODE_TOKEN}
  invoice-prefix: ${TRA_INVOICE_PREFIX}

