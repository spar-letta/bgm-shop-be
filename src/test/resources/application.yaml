spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  datasource:
    driverClassName: org.h2.Driver
    password: sa
    username: sa
    url: jdbc:h2:mem:itibari-test-${random.uuid};DB_CLOSE_DELAY=-1
  liquibase:
    change-log: classpath:/test-liquibase.change-log.xml
    clear-checksums: true
  h2:
    console:
      path: /h2-console
      enabled: 'true'
  sql:
    init:
      continue-on-error: true
      data-locations: classpath:my-data.sql


  cloud:
    gc:
      storage:
        credentials:
          location: classpath:/gcp-credentials-prod.json
      bucket:
        name: itibari-bucket-prd
  batch:
    job:
      enabled: false
    jdbc:
      #      schema: always
      initialize-schema: always
  profiles:
    active: local
logging:
  level:
    com.google.cloud: DEBUG
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        cloud: DEBUG
        integration: DEBUG
    root: info


  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M \(%line\)
      - %msg%n'
customer-app-download-stats:
  google-play:
    enabled: ${CUSTOMER_APP_DOWNLOAD_STATS_IMPORT_ENABLED:false}
    bucket: ${CUSTOMER_APP_DOWNLOAD_STATS_BUCKET:pubsite_prod_7360692091076360515}
    installs-prefix: ${CUSTOMER_APP_DOWNLOAD_STATS_INSTALLS_PREFIX:stats/installs/}
    package-name: ${CUSTOMER_APP_DOWNLOAD_STATS_PACKAGE_NAME:io.itibari.customer}
    start-month: ${CUSTOMER_APP_DOWNLOAD_STATS_START_MONTH:JANUARY}

